stages:
  - build
  - test
  - sonarqube
  - package

variables:
  WEB_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA

build:
  stage: build
  image: node:20-alpine
  script:
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    paths:
      - dist
    expire_in: 1 hour

test:
  stage: test
  image: node:20
  before_script:
    - apt-get update && apt-get install -y chromium --no-install-recommends
    - export CHROME_BIN=/usr/bin/chromium
  script:
    - npm ci
    - npm run test -- --watch=false --browsers=ChromeHeadlessCI --code-coverage
  artifacts:
    paths:
      - coverage
    expire_in: 1 hour

sonarqube-check:
  stage: sonarqube
  image: sonarsource/sonar-scanner-cli:latest
  script:
    - sonar-scanner -Dsonar.host.url="$SONAR_HOST_URL" -Dsonar.token="$SONAR_TOKEN"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

docker-build-push:
  stage: package
  image: docker:24.0
  services:
    - docker:24.0-dind
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
    - docker build -t $WEB_IMAGE -t $CI_REGISTRY_IMAGE:latest .
    - docker push $WEB_IMAGE
    - docker push $CI_REGISTRY_IMAGE:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
